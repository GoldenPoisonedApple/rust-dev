# 共通cargo設定
# Rust 1.90 以降は自己同梱 lld が既定のため、mold を使う前に無効化する
# target: x86_64
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
	"-C", "linker-features=-lld",
	"-C", "link-arg=-fuse-ld=mold",
]

# target: aarch64
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
	"-C", "linker-features=-lld",
	"-C", "link-arg=-fuse-ld=mold",
]
